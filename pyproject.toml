[project]
name = "data-project"
version = "0.1.0"
description = "Dashboard Dash des licences sportives en France (2012-2023) : sport dominant et pratique par région, département et commune."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dash==4.4.1",
    "pandas==3.0.5",
    "plotly==7.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "radon>=6.0.1",
    "ruff>=0.17.3",
]

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true
